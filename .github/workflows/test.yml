name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Block real-data files
        run: |
          bad=$(git ls-files '*.xlsx' '*.xls' '*.csv' | grep -vE '^(data/schedule.csv|templates/|tests/fixtures/)' || true)
          if [ -n "$bad" ]; then echo "Data files not allowed: $bad"; exit 1; fi
